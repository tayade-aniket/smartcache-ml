services:
  - type: web
    name: smartcache-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch && pip install --no-cache-dir -r requirements-prod.txt && pip install --no-cache-dir -e . && python -c \"from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')\""
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: mock
      - key: SIMILARITY_THRESHOLD
        value: "0.85"
      - key: CACHE_DB_PATH
        value: /tmp/cache.db
      - key: OMP_NUM_THREADS
        value: "1"
      - key: STREAMLIT_URL
        value: "https://huggingface.co/spaces/t-anni/Smart-cache"
